[project]
name = "medical-records-rag"
version = "0.1.0"
description = "Medical records RAG assistant — LLM Zoomcamp 2026 capstone"
authors = [
    { name = "Adrián López Rendón", email = "sargent.mg@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # LangChain
    "langchain==0.3.25",
    "langchain-openai==0.3.16",
    "langchain-qdrant==0.2.0",
    "langchain-community==0.3.24",
    # Evaluation
    "ragas==0.2.15",
    # Vector store
    "qdrant-client==1.13.3",
    # Database
    "psycopg2-binary==2.9.12",
    "sqlalchemy==2.0.41",
    # API
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    # Orchestration
    "prefect>=3.6.17",
    "prefect-dbt==0.6.2",
    "prefect-sqlalchemy==0.6.1",
    # Data processing
    "pandas==2.2.3",
    "rank-bm25==0.2.2",
    # Observability
    "langsmith==0.3.45",
    # dbt
    "dbt-core==1.9.1",
    "dbt-postgres==1.9.1",
    "click==8.1.8",
    # Utils
    "python-dotenv==1.1.0",
    "pydantic==2.13.4",
    "datasets>=2.20.0",
]

[tool.uv]
package = false