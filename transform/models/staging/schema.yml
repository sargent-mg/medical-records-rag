version: 2

models:
  - name: stg_patients
    description: Cleaned patient demographics without sensitive identifiers
    columns:
      - name: patient_id
        tests:
          - unique
          - not_null
      - name: full_name
        tests:
          - not_null
      - name: birth_date
        tests:
          - not_null
      - name: gender
        tests:
          - not_null
          - accepted_values:
              values: ["M", "F"]

  - name: stg_conditions
    description: Patient conditions and diagnoses
    columns:
      - name: patient_id
        tests:
          - not_null
      - name: condition_description
        tests:
          - not_null

  - name: stg_medications
    description: Patient medications past and present
    columns:
      - name: patient_id
        tests:
          - not_null
      - name: medication_description
        tests:
          - not_null

  - name: stg_observations
    description: Lab results and vital signs
    columns:
      - name: patient_id
        tests:
          - not_null
      - name: observation_description
        tests:
          - not_null
      - name: value
        tests:
          - not_null

  - name: stg_allergies
    description: Patient allergies and reactions
    columns:
      - name: patient_id
        tests:
          - not_null
      - name: allergy_description
        tests:
          - not_null

  - name: stg_encounters
    description: Patient encounters and visits
    columns:
      - name: encounter_id
        tests:
          - unique
          - not_null
      - name: patient_id
        tests:
          - not_null

  - name: stg_procedures
    description: Procedures performed on patients
    columns:
      - name: patient_id
        tests:
          - not_null
      - name: procedure_description
        tests:
          - not_null